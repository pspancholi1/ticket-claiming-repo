# Postgres only. The app runs on the host via `pnpm dev` so the code stays
# editable without rebuilding an image.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ticket-claiming-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_claiming
    ports:
      - "5433:5432"
    volumes:
      - ticket_claiming_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_claiming"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ticket_claiming_data:
